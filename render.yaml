services:
  - type: web
    name: tracer-ai
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.9.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: tracer-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          type: web
          name: tracer-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_GOOGLE_OAUTH_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: REDIS_ENABLED
        value: 'false'
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: DEV_AUTO_VERIFY_EMAIL
        value: 'false'
      - key: FEATURE_FLAGS
        value: '{"ai-roadmap-generation":true,"ai-learner-assessment":true,"resume-upload":true}'
      - key: AI_PROVIDER
        value: aicredits
      - key: AICREDITS_BASE_URL
        value: https://api.aicredits.in/v1
      - key: MONGODB_URI
        sync: false
      - key: AICREDITS_API_KEY
        sync: false
      - key: AI_MODEL_FAST
        sync: false
      - key: AI_MODEL_CORE
        sync: false
      - key: AI_MODEL_ESCALATION
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      - key: TOKEN_HASH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
